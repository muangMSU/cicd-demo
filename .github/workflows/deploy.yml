name: CI/CD Demo Pipeline

on:
  push:
    branches:
      - 'main' # รันเฉพาะตอนผลักโค้ดเข้า branch main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: muangmsu/cicd-demo # <-- เปลี่ยนตรงนี้ให้ตรงกับชื่อ Repo บน GitHub ของคุณด้วยนะครับ

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: muangmsu
          password: ${{ secrets.GH_TOKEN }}

      - name: 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: 5. Trigger Webhook
        if: success()
        run: |
          # ยิงตรงไปที่ URL ของอาจารย์ตามที่ตกลงกันไว้
          curl -X POST http://cicd.csmsu.net